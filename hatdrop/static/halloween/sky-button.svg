<svg xmlns="http://www.w3.org/2000/svg" class="hw-sky-art" viewBox="0 0 176 116" width="176" height="116" aria-hidden="true" focusable="false">
<defs>
  <linearGradient id="hsb-copper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d0732f"/><stop offset=".5" stop-color="#a64f1c"/><stop offset="1" stop-color="#773211"/>
  </linearGradient>
  <radialGradient id="hsb-core" cx=".5" cy=".46" r=".58">
    <stop offset="0" stop-color="#f19a4c"/><stop offset=".55" stop-color="#bf6126" stop-opacity=".55"/><stop offset="1" stop-color="#7c3511" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hsb-recess" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6b2c0c" stop-opacity=".55"/><stop offset=".18" stop-color="#6b2c0c" stop-opacity="0"/>
    <stop offset=".85" stop-color="#ffb86a" stop-opacity="0"/><stop offset="1" stop-color="#ffb86a" stop-opacity=".25"/>
  </linearGradient>
  <linearGradient id="hsb-wing" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c8662c"/><stop offset=".55" stop-color="#933f17"/><stop offset="1" stop-color="#5e260b"/>
  </linearGradient>
  <linearGradient id="hsb-wing-in" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".35" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="hsb-rivet" cx=".36" cy=".32" r=".72">
    <stop offset="0" stop-color="#fff0b8"/><stop offset=".35" stop-color="#f0b452"/><stop offset=".8" stop-color="#b06a1c"/><stop offset="1" stop-color="#6e3b0d"/>
  </radialGradient>
  <linearGradient id="hsb-bone" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="#fff8e6"/><stop offset=".6" stop-color="#e6d5b2"/><stop offset="1" stop-color="#b9a27a"/>
  </linearGradient>
  <radialGradient id="hsb-eye" cx=".5" cy=".55" r=".6">
    <stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="hsb-glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/><stop offset=".4" stop-color="#ff9a3c" stop-opacity=".45"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
  </radialGradient>

  <!-- left wing; the right one is its mirror -->
  <g id="hsb-wing-l">
    <path d="M61 36C53 28 44 21 34 18 27 21 20 30 13 44 19 43 25 46 27 54 31 51 36 52 38 60 42 58 46 61 48 70 51 66 56 66 61 68Z"
          fill="url(#hsb-wing)" stroke="#250f05" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M61 36C53 28 44 21 34 18 27 21 20 30 13 44 19 43 25 46 27 54 31 51 36 52 38 60 42 58 46 61 48 70 51 66 56 66 61 68Z" fill="url(#hsb-wing-in)"/>
    <!-- membrane folds between the finger bones -->
    <path d="M30 34q6 3 7 10M42 40q4 4 4 11M50 47q3 4 2 10" fill="none" stroke="#6e2d0c" stroke-width=".9" opacity=".7"/>
    <path d="M24 38q5 1 8 5M36 46q4 1 6 5" fill="none" stroke="#e4914c" stroke-width=".7" opacity=".55"/>
    <!-- finger bones with knuckles -->
    <path d="M58 39 34 19M55 41 14 44M55 44 27 53M56 47 38 59M58 51 48 69" fill="none" stroke="#4d1f08" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M58 38 35 20" fill="none" stroke="#f0a25a" stroke-width=".8" stroke-linecap="round" opacity=".8"/>
    <g fill="#d98a45" stroke="#3a1606" stroke-width=".7"><circle cx="44" cy="27" r="1.4"/><circle cx="36" cy="43" r="1.3"/><circle cx="42" cy="48" r="1.2"/></g>
    <!-- wrist claw -->
    <path d="M34 18 30 12.5 36.5 16.5Z" fill="#f2c27a" stroke="#250f05" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- small tear in the membrane -->
    <path d="M21 41l2 2-1 2" fill="none" stroke="#250f05" stroke-width=".9"/>
    <!-- foot gripping the plaque -->
    <path d="M60 72q-5 1-6 5 2-1 4-.5-1 2 0 4 1.5-2 3.5-2.5Z" fill="#a24d1b" stroke="#250f05" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M54 77l-1.6 1.6M56.5 80.5l-1 2" stroke="#f2c27a" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</defs>

<!-- spark ring (shown on press) -->
<g class="hsb-burst" fill="none" stroke="#ffcf6a" stroke-width="2" stroke-linecap="round">
  <circle cx="94" cy="54" r="30" stroke-dasharray="3 7"/>
</g>

<g class="hsb-wing hsb-wing-l"><use href="#hsb-wing-l"/></g>
<g class="hsb-wing hsb-wing-r"><use href="#hsb-wing-l" transform="translate(188 0) scale(-1 1)"/></g>

<g class="hsb-plaque">
  <!-- body -->
  <rect x="57" y="17" width="74" height="74" rx="7" fill="#250f05"/>
  <rect x="60" y="20" width="68" height="68" rx="5" fill="url(#hsb-copper)"/>
  <rect x="60" y="20" width="68" height="68" rx="5" fill="url(#hsb-core)"/>
  <!-- bevel -->
  <path d="M62.5 86.5V24.5q0-2 2-2h59" fill="none" stroke="#f3ad66" stroke-width="1.4" stroke-linecap="round" opacity=".85"/>
  <path d="M125.5 23v62q0 2-2 2h-59" fill="none" stroke="#4d1f08" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
  <!-- recessed panel -->
  <rect x="66" y="26" width="56" height="56" rx="3" fill="url(#hsb-recess)"/>
  <rect x="66" y="26" width="56" height="56" rx="3" fill="none" stroke="#4d1f08" stroke-width="2"/>
  <rect x="67.5" y="27.5" width="53" height="53" rx="2" fill="none" stroke="#e8924d" stroke-width=".7" opacity=".55"/>
  <!-- hammered copper -->
  <g fill="#5e260b" opacity=".35"><circle cx="76" cy="40" r="1.1"/><circle cx="109" cy="36" r=".9"/><circle cx="113" cy="66" r="1.2"/><circle cx="74" cy="70" r=".9"/><circle cx="98" cy="74" r="1"/><circle cx="86" cy="33" r=".8"/></g>
  <g fill="#ffd09a" opacity=".35"><circle cx="77" cy="39" r=".6"/><circle cx="110" cy="35" r=".5"/><circle cx="112" cy="65" r=".6"/></g>
  <!-- scratches -->
  <path d="M104 72l7-3M71 46l3 6M108 44l4-2" stroke="#ffcf9a" stroke-width=".6" stroke-linecap="round" opacity=".45"/>
  <!-- engraved corner filigree -->
  <g fill="none" stroke="#5e260b" stroke-width=".9" stroke-linecap="round" opacity=".8">
    <path d="M74 31q4 0 5 4M71 34q0 4 4 5"/><path d="M114 31q-4 0-5 4M117 34q0 4-4 5"/>
    <path d="M74 77q4 0 5-4M71 74q0-4 4-5"/><path d="M114 77q-4 0-5-4M117 74q0-4-4-5"/>
  </g>
  <!-- rivets -->
  <g class="hsb-rivets">
    <g stroke="#3a1a08" stroke-width="1.3" fill="url(#hsb-rivet)">
      <circle cx="68" cy="28" r="4.6"/><circle cx="120" cy="28" r="4.6"/><circle cx="68" cy="80" r="4.6"/><circle cx="120" cy="80" r="4.6"/>
    </g>
    <g fill="#fff8dc"><circle cx="66.6" cy="26.5" r="1.1"/><circle cx="118.6" cy="26.5" r="1.1"/><circle cx="66.6" cy="78.5" r="1.1"/><circle cx="118.6" cy="78.5" r="1.1"/></g>
  </g>
  <!-- glow behind the moon / sun icon -->
  <circle class="hsb-glow" cx="94" cy="54" r="24" fill="url(#hsb-glow)"/>
</g>

<g class="hsb-skull">
  <path d="M94 81.5c-7.8 0-12.5 5.2-12.5 11.4 0 3.6 1.8 6.1 4.5 7.4h16c2.7-1.3 4.5-3.8 4.5-7.4 0-6.2-4.7-11.4-12.5-11.4z"
        fill="url(#hsb-bone)" stroke="#250f05" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M98 83.5l-1.5 3 2 2" fill="none" stroke="#7a6446" stroke-width=".8"/>
  <path d="M85 97q2 2 4 1.5M103 97q-2 2-4 1.5" fill="none" stroke="#b39a73" stroke-width="1"/>
  <g fill="#250f05"><ellipse cx="89.2" cy="93.5" rx="3.4" ry="3.6"/><ellipse cx="98.8" cy="93.5" rx="3.4" ry="3.6"/><path d="M94 96.8l-1.7 3.1h3.4z"/></g>
  <g class="hsb-eyes" fill="url(#hsb-eye)"><circle cx="89.2" cy="93.8" r="2.4"/><circle cx="98.8" cy="93.8" r="2.4"/></g>
  <path d="M87.5 86c2-1.7 4.2-2.2 6.5-2.2" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>
  <g class="hsb-jaw">
    <path d="M86.5 100.3h15v3.6q0 2-2 2h-11q-2 0-2-2z" fill="url(#hsb-bone)" stroke="#250f05" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M90 100.6v4.8M94 100.6v4.8M98 100.6v4.8" stroke="#250f05" stroke-width="1.1"/>
  </g>
</g>
</svg>
